services:
  redis:
    image: redis:7-alpine
    container_name: lifeflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lifeflow-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lifeflow-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  edge-gateway:
    build:
      context: ./edge-gateway
      dockerfile: Dockerfile
    container_name: lifeflow-edge-gateway
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - BACKEND_URL=http://backend:8080
    depends_on:
      - mosquitto
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeflow-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-lifeflow}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - AI_SERVICE_URL=http://ai-service:8000
      - EDGE_GATEWAY_URL=http://edge-gateway:8081
      - JWT_SECRET=${JWT_SECRET:-lifeflow_emergency_digital_twin_super_secure_jwt_secret_key_2026_at_least_256_bits_length!}
    depends_on:
      - redis
      - mosquitto
      - ai-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lifeflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
