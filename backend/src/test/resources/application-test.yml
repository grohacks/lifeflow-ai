spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

lifeflow:
  jwt:
    secret: test_super_secure_jwt_secret_key_2026_at_least_256_bits_length_for_unit_tests!
    expiration-ms: 3600000

  mqtt:
    broker-url: tcp://localhost:1883
    client-id: lifeflow-test-client

  ai-service:
    url: http://localhost:8000

  edge-gateway:
    url: http://localhost:8081

  storage:
    upload-dir: ./target/test-uploads
